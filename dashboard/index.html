<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống MDM - VN30</title>
<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<style>
:root {
  --bg-primary: #0f1923;
  --bg-secondary: #1a2332;
  --bg-card: #1e2d3d;
  --bg-hover: #253647;
  --text-primary: #e1e8ed;
  --text-secondary: #8899a6;
  --accent: #1da1f2;
  --green: #17bf63;
  --red: #e0245e;
  --yellow: #ffad1f;
  --border: #2f3f4f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Header */
header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 20px 0;
}
header h1 { font-size: 24px; font-weight: 700; }
header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

/* Tab content */
.tab-content { padding: 24px 0; }

/* Metrics cards */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}
.metric-card .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.metric-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.metric-card .value.positive { color: var(--green); }
.metric-card .value.negative { color: var(--red); }
.benchmark-row {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  align-items: center;
}
.benchmark-row .tag {
  background: var(--bg-hover);
  color: var(--yellow);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
}
.benchmark-row .bm-item { margin-left: 16px; }

/* Section nav */
.section-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  gap: 8px;
  padding: 10px 0;
  margin-bottom: 16px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
}
.nav-btn {
  padding: 6px 14px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.nav-btn:hover {
  background: var(--bg-hover);
  color: var(--accent);
  border-color: var(--accent);
}
.filter-btn.active {
  background: var(--accent) !important;
  color: #fff !important;
  border-color: var(--accent) !important;
}

/* Charts */
.chart-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 24px;
}
.chart-section h3 {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.price-chart { width: 100%; height: 500px; }
.equity-chart-wrap { position: relative; width: 100%; height: 350px; }
.equity-chart-canvas { width: 100%; height: 100%; }

/* Trade table */
.trades-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 24px;
}
.trades-section h3 {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 2px solid var(--border);
  color: var(--text-secondary);
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--accent); }
tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
tbody tr:hover { background: var(--bg-hover); }
.pnl-positive { color: var(--green); font-weight: 600; }
.pnl-negative { color: var(--red); font-weight: 600; }
.type-buy { color: var(--green); }
.type-sell { color: var(--red); }
.type-cash { color: var(--yellow); }

/* Strategy docs */
.docs-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 24px;
}
.docs-toggle {
  padding: 16px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
.docs-toggle h3 {
  font-size: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.docs-toggle .arrow { color: var(--text-secondary); transition: transform 0.2s; }
.docs-toggle.open .arrow { transform: rotate(180deg); }
.docs-body {
  display: none;
  padding: 0 16px 16px 16px;
  max-height: 600px;
  overflow-y: auto;
}
.docs-body.open { display: block; }
.docs-body h1, .docs-body h2, .docs-body h3 { margin: 16px 0 8px 0; color: var(--accent); }
.docs-body h1 { font-size: 20px; }
.docs-body h2 { font-size: 16px; }
.docs-body h3 { font-size: 14px; }
.docs-body p { margin-bottom: 8px; color: var(--text-primary); }
.docs-body table { margin: 12px 0; }
.docs-body th, .docs-body td { padding: 6px 10px; border: 1px solid var(--border); }
.docs-body code { background: var(--bg-hover); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
.docs-body ul, .docs-body ol { margin: 8px 0 8px 24px; }
.docs-body strong { color: var(--yellow); }

/* Footer */
footer {
  text-align: center;
  padding: 20px;
  color: var(--text-secondary);
  font-size: 12px;
  border-top: 1px solid var(--border);
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px;
  color: var(--text-secondary);
  font-size: 16px;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Hệ thống MDM Trading</h1>
    <div class="subtitle">Market Direction Model - Backtest trên VN30 & VNINDEX</div>
  </div>
</header>

<main class="container">
  <div style="display:flex; gap:8px; margin:16px 0; flex-wrap:wrap;" id="model-tabs">
    <button class="nav-btn" style="padding:8px 16px; cursor:pointer;" onclick="switchModel('mdm_v2')" id="tab-mdm_v2">VN30</button>
    <button class="nav-btn" style="padding:8px 16px; cursor:pointer;" onclick="switchModel('mdm_vnindex')" id="tab-mdm_vnindex">VNINDEX</button>
  </div>
  <div id="model-content"><div class="loading">Loading...</div></div>
</main>

<footer>
  <div class="container">
    <span id="footer-info">Hệ thống MDM Trading Dashboard</span>
  </div>
</footer>

<script>
const DATA_PATH = 'data';
const modelCache = {};
const chartInstances = {};
let liquidityData = null;

// Load metadata
fetch(DATA_PATH + '/metadata.json')
  .then(r => r.json())
  .then(meta => {
    document.getElementById('footer-info').textContent =
      `Hệ thống MDM | Dữ liệu: ${meta.data_range.start} - ${meta.data_range.end} | Cập nhật: ${meta.generated_at}`;
  });

// Load liquidity overlay
fetch(DATA_PATH + '/liquidity_overlay.json')
  .then(r => r.json())
  .then(d => { liquidityData = d; })
  .catch(() => {});

let currentModel = 'mdm_v2';

function switchModel(key) {
  currentModel = key;
  // Update tab active state
  document.querySelectorAll('#model-tabs button').forEach(btn => {
    btn.style.background = btn.id === 'tab-' + key ? 'var(--accent)' : '';
    btn.style.color = btn.id === 'tab-' + key ? '#fff' : '';
  });
  const container = document.getElementById('model-content');
  container.innerHTML = '<div class="loading">Loading...</div>';
  // Clear rendered flag and chart instances for this container
  delete container.dataset.rendered;
  Object.keys(chartInstances).forEach(k => { if (k.startsWith(key)) delete chartInstances[k]; });
  loadModel(key);
}

// Load first tab
switchModel('mdm_v2');

async function loadModel(key) {
  if (modelCache[key]) {
    renderModel(key, modelCache[key]);
    return;
  }
  try {
    const resp = await fetch(`${DATA_PATH}/${key}.json`);
    const data = await resp.json();
    modelCache[key] = data;
    renderModel(key, data);
  } catch (e) {
    document.getElementById('model-content').innerHTML =
      `<div class="loading">Error loading data: ${e.message}</div>`;
  }
}

function renderModel(key, data) {
  const container = document.getElementById('model-content');
  container.innerHTML = '';
  container.dataset.rendered = '1';

  const m = data.metrics;
  const b = data.benchmark;

  container.innerHTML = `
    <div class="metrics-row">
      <div class="metric-card">
        <div class="label">Tổng lợi nhuận</div>
        <div class="value positive">+${m.total_return}%</div>
      </div>
      <div class="metric-card">
        <div class="label">CAGR</div>
        <div class="value positive">${m.cagr}%</div>
      </div>
      <div class="metric-card">
        <div class="label">Sụt giảm tối đa</div>
        <div class="value negative">${m.max_dd}%</div>
      </div>
      <div class="metric-card">
        <div class="label">Số lệnh</div>
        <div class="value" style="color:var(--accent)">${m.trades}</div>
      </div>
      <div class="metric-card">
        <div class="label">% Thời gian đầu tư</div>
        <div class="value" style="color:var(--accent)">${m.invested_pct}%</div>
      </div>
    </div>

    <div class="benchmark-row">
      <span class="tag">Mua & Nắm giữ</span>
      <span class="bm-item">Lợi nhuận: <strong style="color:var(--text-primary)">${b.total_return > 0 ? '+' : ''}${b.total_return}%</strong></span>
      <span class="bm-item">CAGR: <strong style="color:var(--text-primary)">${b.cagr}%</strong></span>
      <span class="bm-item">Sụt giảm tối đa: <strong style="color:var(--red)">${b.max_dd}%</strong></span>
    </div>

    <nav class="section-nav" id="section-nav-${key}">
      <a class="nav-btn" href="#sec-chart-${key}">Biểu đồ giá</a>
      <a class="nav-btn" href="#sec-equity-${key}">Đường vốn</a>
      <a class="nav-btn" href="#sec-stats-${key}">Thống kê tín hiệu</a>
      <a class="nav-btn" href="#sec-signals-${key}">Lịch sử tín hiệu</a>
      <a class="nav-btn" href="#sec-docs-${key}">Quy tắc chiến lược</a>
    </nav>

    <div id="sec-chart-${key}" style="display:flex; gap:12px; flex-wrap:wrap;">
      <div class="chart-section" style="flex:1; min-width:0;">
        <h3>Giá + Tín hiệu giao dịch</h3>
        <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;" id="signal-filters-${key}">
          <button class="nav-btn filter-btn active" style="padding:4px 12px; font-size:12px; cursor:pointer;" data-filter="ALL" onclick="filterSignals('${key}','ALL',this)">Tất cả</button>
          <button class="nav-btn filter-btn" style="padding:4px 12px; font-size:12px; cursor:pointer; color:var(--green);" data-filter="BUY" onclick="filterSignals('${key}','BUY',this)">BUY</button>
          <button class="nav-btn filter-btn" style="padding:4px 12px; font-size:12px; cursor:pointer; color:var(--red);" data-filter="SELL" onclick="filterSignals('${key}','SELL',this)">SELL</button>
          <button class="nav-btn filter-btn" style="padding:4px 12px; font-size:12px; cursor:pointer; color:var(--yellow);" data-filter="CASH" onclick="filterSignals('${key}','CASH',this)">CASH</button>
        </div>
        <div class="price-chart" id="price-chart-${key}"></div>
      </div>
      <div class="trades-section" id="sec-trades-${key}" style="width:480px; flex-shrink:0;">
        <h3>Chi tiết giao dịch (${data.trades.length})</h3>
        <div style="max-height:560px; overflow-y:auto;">
          <table>
            <thead>
              <tr>
                <th>Ngày</th>
                <th>Loại</th>
                <th>Giá</th>
                <th>Lãi/Lỗ</th>
                <th>Lý do</th>
              </tr>
            </thead>
            <tbody id="trades-tbody-${key}"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="chart-section" id="sec-equity-${key}">
      <h3>Đường vốn: Chiến lược vs Mua & Nắm giữ</h3>
      <div class="equity-chart-wrap"><canvas class="equity-chart-canvas" id="equity-chart-${key}"></canvas></div>
    </div>

    <div class="trades-section" id="sec-stats-${key}">
      <h3>Thống kê tín hiệu</h3>
      <div id="signal-stats-${key}"></div>
    </div>

    <div class="trades-section" id="sec-signals-${key}">
      <h3>Lịch sử tín hiệu - Vốn ban đầu: 100,000,000 VND</h3>
      <div style="max-height:500px; overflow-y:auto;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Ngày</th>
              <th>Tín hiệu</th>
              <th>VN30</th>
              <th>Giá trị danh mục</th>
              <th>Lãi/Lỗ lệnh</th>
              <th>Tích lũy</th>
            </tr>
          </thead>
          <tbody id="signal-history-${key}"></tbody>
        </table>
      </div>
    </div>

    <div class="docs-section" id="sec-docs-${key}">
      <div class="docs-toggle" onclick="toggleDocs('${key}')">
        <h3>Logic & Quy tắc chiến lược</h3>
        <span class="arrow">&#9660;</span>
      </div>
      <div class="docs-body" id="docs-body-${key}"></div>
    </div>
  `;

  renderPriceChart(key, data);
  renderEquityChart(key, data);
  renderSignalStats(key, data);
  renderSignalHistory(key, data);
  renderTradesTable(key, data);
  renderDocs(key, data);
}

function filterSignals(key, filterType, btn) {
  // Update button active state
  const container = document.getElementById('signal-filters-' + key);
  container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  // Filter chart markers
  const allMarkers = chartInstances['markers-' + key] || [];
  const candleSeries = chartInstances['candle-' + key];
  if (candleSeries) {
    const filtered = filterType === 'ALL'
      ? allMarkers
      : allMarkers.filter(m => m._type === filterType);
    candleSeries.setMarkers(filtered);
  }

  // Filter trades table
  const allTrades = chartInstances['trades-' + key] || [];
  const tbody = document.getElementById('trades-tbody-' + key);
  if (tbody) {
    const filtered = filterType === 'ALL' ? allTrades : allTrades.filter(t => {
      if (filterType === 'BUY') return t.type === 'BUY';
      if (filterType === 'SELL') return t.type === 'SELL_SIGNAL';
      if (filterType === 'CASH') return ['CASH_EXIT', 'EXIT_TO_CASH', 'SHORT_COVER', 'FAIL_SAFE_EXIT', 'STATE_DEGRADE'].includes(t.type);
      return true;
    });
    const heading = document.querySelector('#sec-trades-' + key + ' h3');
    if (heading) heading.textContent = `Chi tiết giao dịch (${filtered.length} / ${allTrades.length} bản ghi)`;

    let rows = '';
    [...filtered].reverse().forEach((t, i) => {
      const typeClass = t.type === 'BUY' ? 'type-buy'
        : t.type === 'CASH_EXIT' ? 'type-sell'
        : 'type-cash';
      const pnlClass = t.pnl > 0 ? 'pnl-positive' : t.pnl < 0 ? 'pnl-negative' : '';
      const pnlText = t.pnl != null ? `${t.pnl > 0 ? '+' : ''}${t.pnl}%` : '-';
      const price = t.price != null ? t.price.toLocaleString() : '-';
      const label = t.type === 'BUY' ? 'BUY'
        : t.type === 'SELL_SIGNAL' ? 'SELL'
        : t.type === 'CASH_EXIT' ? 'EXIT'
        : t.type === 'SHORT_COVER' ? 'COVER'
        : t.type === 'FAIL_SAFE_EXIT' ? 'F-SAFE'
        : t.type;
      rows += `<tr>
        <td>${t.date}</td>
        <td class="${typeClass}">${label}</td>
        <td>${price}</td>
        <td class="${pnlClass}">${pnlText}</td>
        <td style="font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${t.reason || ''}">${t.reason || '-'}</td>
      </tr>`;
    });
    tbody.innerHTML = rows;
  }
}

function renderPriceChart(key, data) {
  const el = document.getElementById('price-chart-' + key);
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: 500,
    layout: {
      background: { color: '#1e2d3d' },
      textColor: '#8899a6',
    },
    grid: {
      vertLines: { color: '#2f3f4f' },
      horzLines: { color: '#2f3f4f' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { borderColor: '#2f3f4f' },
    rightPriceScale: { borderColor: '#2f3f4f' },
  });

  // Candlestick series
  const candleSeries = chart.addCandlestickSeries({
    upColor: '#17bf63',
    downColor: '#e0245e',
    borderUpColor: '#17bf63',
    borderDownColor: '#e0245e',
    wickUpColor: '#17bf63',
    wickDownColor: '#e0245e',
  });

  const ohlcData = data.price_data.map(p => ({
    time: p.date,
    open: p.open,
    high: p.high,
    low: p.low,
    close: p.close,
  }));
  candleSeries.setData(ohlcData);

  // Volume histogram on separate price scale
  const volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'volume',
  });

  chart.priceScale('volume').applyOptions({
    scaleMargins: { top: 0.8, bottom: 0 },
  });

  const volumeData = data.price_data.map(p => ({
    time: p.date,
    value: p.volume,
    color: p.close >= p.open ? 'rgba(23,191,99,0.3)' : 'rgba(224,36,94,0.3)',
  }));
  volumeSeries.setData(volumeData);

  // Signal markers on candlestick
  const allMarkers = data.signals.map(s => ({
    time: s.date,
    position: s.type === 'BUY' ? 'belowBar' : 'aboveBar',
    color: s.type === 'BUY' ? '#17bf63' : s.type === 'SELL' ? '#e0245e' : '#ffad1f',
    shape: s.type === 'BUY' ? 'arrowUp' : 'arrowDown',
    text: s.type,
    size: 1.5,
    _type: s.type,
  }));
  candleSeries.setMarkers(allMarkers);

  // Store for filtering
  chartInstances['price-' + key] = chart;
  chartInstances['candle-' + key] = candleSeries;
  chartInstances['markers-' + key] = allMarkers;
  chartInstances['trades-' + key] = data.trades;

  new ResizeObserver(() => {
    chart.applyOptions({ width: el.clientWidth });
  }).observe(el);
}

// Chart.js plugin to draw QE floor shaded zones
const qeZonePlugin = {
  id: 'qeZones',
  beforeDraw(chart) {
    if (!liquidityData || !liquidityData.qe_zones) return;
    const ctx = chart.ctx;
    const xScale = chart.scales.x;
    const yScale = chart.scales.y;
    const labels = chart.data.labels;
    if (!labels || labels.length === 0) return;

    ctx.save();
    ctx.fillStyle = 'rgba(23, 191, 99, 0.08)';
    liquidityData.qe_zones.forEach(zone => {
      const startIdx = labels.findIndex(l => l >= zone.start);
      const endIdx = labels.findIndex(l => l > zone.end);
      if (startIdx < 0) return;
      const si = startIdx;
      const ei = endIdx < 0 ? labels.length - 1 : endIdx;
      const x1 = xScale.getPixelForValue(si);
      const x2 = xScale.getPixelForValue(ei);
      ctx.fillRect(x1, yScale.top, x2 - x1, yScale.bottom - yScale.top);
    });
    ctx.restore();
  }
};

function renderEquityChart(key, data) {
  const ctx = document.getElementById('equity-chart-' + key).getContext('2d');
  const eq = data.equity_curve;

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: eq.map(p => p.date),
      datasets: [
        {
          label: data.name,
          data: eq.map(p => p.strategy),
          borderColor: '#1da1f2',
          borderWidth: 2,
          fill: false,
          pointRadius: 0,
          tension: 0.1,
        },
        {
          label: 'Mua & Nắm giữ',
          data: eq.map(p => p.buy_hold),
          borderColor: '#8899a6',
          borderWidth: 1.5,
          borderDash: [5, 5],
          fill: false,
          pointRadius: 0,
          tension: 0.1,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: {
          labels: { color: '#8899a6', font: { size: 12 } },
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${((ctx.parsed.y - 1) * 100).toFixed(1)}%`,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: '#8899a6',
            maxTicksLimit: 12,
            font: { size: 11 },
          },
          grid: { color: '#2f3f4f' },
        },
        y: {
          type: 'logarithmic',
          min: 0.8,
          ticks: {
            color: '#8899a6',
            font: { size: 11 },
            callback: v => {
              const pct = ((v - 1) * 100).toFixed(0);
              return `${pct >= 0 ? '+' : ''}${pct}%`;
            },
          },
          grid: { color: '#2f3f4f' },
          afterBuildTicks: (axis) => {
            const maxVal = Math.max(...axis.chart.data.datasets.flatMap(d => d.data));
            const ticks = [0.8, 1, 1.5, 2, 3, 4, 5, 6, 8, 10, 15];
            axis.ticks = ticks.filter(v => v <= maxVal * 1.2).map(v => ({ value: v }));
          },
        },
      },
    },
    plugins: [qeZonePlugin],
  });
}

function formatVND(n) {
  return n.toLocaleString('vi-VN');
}

function renderSignalStats(key, data) {
  const el = document.getElementById('signal-stats-' + key);
  const s = data.signal_stats;
  if (!s) { el.innerHTML = '<p style="color:var(--text-secondary)">Không có dữ liệu thống kê</p>'; return; }

  const sp = s.state_pct;
  const ad = s.avg_duration;
  const bb = s.buy_breakdown;
  const sb = s.sell_breakdown;
  const eb = s.exit_breakdown;
  const se = s.sell_exit_breakdown;
  const totalBuy = (bb.FTD||0) + (bb.MA50||0) + (bb['52WEEK']||0) + (bb.other||0);
  const totalSell = (sb.MA50_breakdown||0) + (sb.cash_deterioration||0);
  const totalExit = (eb.stop_loss||0) + (eb.dd_threshold||0) + (eb.ma10_below||0) + (eb.other||0);
  const totalCover = (se.fail_safe||0) + (se.ftd_cover||0) + (se.ma50_cover||0) + (se.dd5_short_stop||0);

  let html = `
  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:16px; margin-bottom:20px;">
    <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
      <h4 style="color:var(--accent); margin-bottom:12px;">Thời gian ở mỗi trạng thái</h4>
      <div style="display:flex; gap:4px; height:24px; border-radius:4px; overflow:hidden; margin-bottom:8px;">
        <div style="width:${sp.BUY}%; background:var(--green);" title="BUY ${sp.BUY}%"></div>
        <div style="width:${sp.SELL}%; background:var(--red);" title="SELL ${sp.SELL}%"></div>
        <div style="width:${sp.CASH}%; background:var(--text-secondary);" title="CASH ${sp.CASH}%"></div>
      </div>
      <div style="font-size:13px; color:var(--text-secondary);">
        <span style="color:var(--green);">BUY ${sp.BUY}%</span> &middot;
        <span style="color:var(--red);">SELL ${sp.SELL}%</span> &middot;
        <span>CASH ${sp.CASH}%</span>
      </div>
      <div style="font-size:12px; color:var(--text-secondary); margin-top:8px;">
        TB mỗi lần: BUY ${ad.BUY?.avg||'-'} ngày (${ad.BUY?.min||'-'}-${ad.BUY?.max||'-'}) &middot;
        SELL ${ad.SELL?.avg||'-'} ngày &middot; CASH ${ad.CASH?.avg||'-'} ngày
      </div>
    </div>

    <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
      <h4 style="color:var(--green); margin-bottom:12px;">Tín hiệu MUA (${totalBuy})</h4>
      <table style="font-size:13px; width:100%;">
        <tr><td>FTD classic</td><td style="text-align:right;">${bb.FTD||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalBuy ? Math.round((bb.FTD||0)/totalBuy*100) : 0}%</td></tr>
        <tr><td>MA50 breakout</td><td style="text-align:right;">${bb.MA50||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalBuy ? Math.round((bb.MA50||0)/totalBuy*100) : 0}%</td></tr>
        <tr><td>52-week breakout</td><td style="text-align:right;">${bb['52WEEK']||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalBuy ? Math.round((bb['52WEEK']||0)/totalBuy*100) : 0}%</td></tr>
        ${bb.other ? `<tr><td>Khác</td><td style="text-align:right;">${bb.other}</td><td style="text-align:right; color:var(--text-secondary);">${Math.round(bb.other/totalBuy*100)}%</td></tr>` : ''}
      </table>
    </div>

    <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
      <h4 style="color:var(--red); margin-bottom:12px;">Tín hiệu BÁN (${totalSell})</h4>
      <table style="font-size:13px; width:100%;">
        <tr><td>MA50 breakdown</td><td style="text-align:right;">${sb.MA50_breakdown||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalSell ? Math.round((sb.MA50_breakdown||0)/totalSell*100) : 0}%</td></tr>
        <tr><td>Cash deterioration</td><td style="text-align:right;">${sb.cash_deterioration||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalSell ? Math.round((sb.cash_deterioration||0)/totalSell*100) : 0}%</td></tr>
      </table>
    </div>

    <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
      <h4 style="color:var(--yellow); margin-bottom:12px;">Thoát BUY (${totalExit})</h4>
      <table style="font-size:13px; width:100%;">
        <tr><td>MA10 dưới ${data.metrics?.trades ? '' : ''}3 phiên</td><td style="text-align:right;">${eb.ma10_below||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalExit ? Math.round((eb.ma10_below||0)/totalExit*100) : 0}%</td></tr>
        <tr><td>Stop loss</td><td style="text-align:right;">${eb.stop_loss||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalExit ? Math.round((eb.stop_loss||0)/totalExit*100) : 0}%</td></tr>
        <tr><td>DD threshold</td><td style="text-align:right;">${eb.dd_threshold||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalExit ? Math.round((eb.dd_threshold||0)/totalExit*100) : 0}%</td></tr>
      </table>
    </div>

    <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
      <h4 style="color:var(--accent); margin-bottom:12px;">Thoát SELL (${totalCover})</h4>
      <table style="font-size:13px; width:100%;">
        <tr><td>MA50 cover</td><td style="text-align:right;">${se.ma50_cover||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalCover ? Math.round((se.ma50_cover||0)/totalCover*100) : 0}%</td></tr>
        <tr><td>Fail-safe</td><td style="text-align:right;">${se.fail_safe||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalCover ? Math.round((se.fail_safe||0)/totalCover*100) : 0}%</td></tr>
        <tr><td>FTD cover</td><td style="text-align:right;">${se.ftd_cover||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalCover ? Math.round((se.ftd_cover||0)/totalCover*100) : 0}%</td></tr>
        <tr><td>DD5 short stop</td><td style="text-align:right;">${se.dd5_short_stop||0}</td><td style="text-align:right; color:var(--text-secondary);">${totalCover ? Math.round((se.dd5_short_stop||0)/totalCover*100) : 0}%</td></tr>
      </table>
    </div>
  </div>

  <div style="background:var(--bg-secondary); border-radius:8px; padding:16px;">
    <h4 style="color:var(--accent); margin-bottom:12px;">Hiệu suất theo năm</h4>
    <table style="font-size:13px; width:100%;">
      <thead><tr>
        <th>Năm</th><th style="text-align:right;">Chiến lược</th><th style="text-align:right;">Mua & Giữ</th>
        <th style="text-align:right;">Max DD</th><th style="text-align:right;">Chuyển</th>
        <th style="text-align:right;">BUY%</th><th style="text-align:right;">SELL%</th><th style="text-align:right;">CASH%</th>
      </tr></thead>
      <tbody>
        ${(s.yearly||[]).map(y => `<tr>
          <td>${y.year}</td>
          <td style="text-align:right; color:${y.strategy_return >= 0 ? 'var(--green)' : 'var(--red)'};">${y.strategy_return >= 0 ? '+' : ''}${y.strategy_return}%</td>
          <td style="text-align:right; color:${y.buy_hold_return >= 0 ? 'var(--green)' : 'var(--red)'};">${y.buy_hold_return >= 0 ? '+' : ''}${y.buy_hold_return}%</td>
          <td style="text-align:right; color:var(--red);">${y.max_dd}%</td>
          <td style="text-align:right;">${y.transitions}</td>
          <td style="text-align:right;">${y.buy_pct}%</td>
          <td style="text-align:right;">${y.sell_pct}%</td>
          <td style="text-align:right;">${y.cash_pct}%</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  el.innerHTML = html;
}

function renderSignalHistory(key, data) {
  const tbody = document.getElementById('signal-history-' + key);
  if (!data.signal_history || data.signal_history.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary)">Không có dữ liệu tín hiệu</td></tr>';
    return;
  }
  const reversed = [...data.signal_history].reverse();
  let rows = '';
  reversed.forEach((s, i) => {
    const signalClass = s.signal === 'BUY' ? 'type-buy'
      : s.signal === 'SELL' ? 'type-sell'
      : 'type-cash';
    const pnlClass = s.trade_pnl > 0 ? 'pnl-positive' : s.trade_pnl < 0 ? 'pnl-negative' : '';
    const pnlText = s.trade_pnl != null ? `${s.trade_pnl > 0 ? '+' : ''}${s.trade_pnl}%` : '-';
    const cumClass = s.cumulative_return >= 0 ? 'pnl-positive' : 'pnl-negative';

    rows += `<tr>
      <td>${reversed.length - i}</td>
      <td>${s.date}</td>
      <td class="${signalClass}" style="font-weight:700">${s.signal}</td>
      <td>${s.price.toLocaleString()}</td>
      <td style="font-weight:600">${formatVND(s.portfolio)}</td>
      <td class="${pnlClass}">${pnlText}</td>
      <td class="${cumClass}">${s.cumulative_return > 0 ? '+' : ''}${s.cumulative_return}%</td>
    </tr>`;
  });
  tbody.innerHTML = rows;
}

function renderTradesTable(key, data) {
  const tbody = document.getElementById('trades-tbody-' + key);
  let rows = '';
  [...data.trades].reverse().forEach((t, i) => {
    const typeClass = t.type === 'BUY' ? 'type-buy'
      : t.type === 'CASH_EXIT' ? 'type-sell'
      : 'type-cash';
    const pnlClass = t.pnl > 0 ? 'pnl-positive' : t.pnl < 0 ? 'pnl-negative' : '';
    const pnlText = t.pnl != null ? `${t.pnl > 0 ? '+' : ''}${t.pnl}%` : '-';
    const price = t.price != null ? t.price.toLocaleString() : '-';
    const label = t.type === 'BUY' ? 'BUY'
      : t.type === 'SELL_SIGNAL' ? 'SELL'
      : t.type === 'CASH_EXIT' ? 'EXIT'
      : t.type === 'SHORT_COVER' ? 'COVER'
      : t.type === 'FAIL_SAFE_EXIT' ? 'F-SAFE'
      : t.type;

    rows += `<tr>
      <td>${t.date}</td>
      <td class="${typeClass}">${label}</td>
      <td>${price}</td>
      <td class="${pnlClass}">${pnlText}</td>
      <td style="font-size:11px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${t.reason || ''}">${t.reason || '-'}</td>
    </tr>`;
  });
  tbody.innerHTML = rows;
}

function renderDocs(key, data) {
  const body = document.getElementById('docs-body-' + key);
  if (data.description_md) {
    // Extract LaTeX BEFORE marked parses (to avoid &lt; &gt; encoding)
    let md = data.description_md;
    const store = [];
    // Block math $$...$$
    md = md.replace(/\$\$([\s\S]*?)\$\$/g, (m, tex) => {
      const i = store.length;
      try { store.push(katex.renderToString(tex.trim(), {displayMode: true, throwOnError: false})); }
      catch(e) { store.push(m); }
      return '%%MATH' + i + '%%';
    });
    // Inline math $...$
    md = md.replace(/\$([^\$\n]+?)\$/g, (m, tex) => {
      const i = store.length;
      try { store.push(katex.renderToString(tex.trim(), {displayMode: false, throwOnError: false})); }
      catch(e) { store.push(m); }
      return '%%MATH' + i + '%%';
    });
    // Parse markdown
    let html = marked.parse(md);
    // Restore LaTeX
    store.forEach((v, i) => { html = html.replace('%%MATH' + i + '%%', v); });
    body.innerHTML = html;
  } else {
    body.innerHTML = '<p style="color:var(--text-secondary)">Chưa có tài liệu.</p>';
  }
}

function toggleDocs(key) {
  const toggle = document.querySelector(`#content-${key} .docs-toggle`);
  const body = document.getElementById('docs-body-' + key);
  toggle.classList.toggle('open');
  body.classList.toggle('open');
}
</script>
