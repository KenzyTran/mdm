[project]
name = "mdm"
version = "1.0.0"
description = "Market Direction Model - Trading Signal System for VNINDEX"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: marks tests as regression tests (deselect with '-m \"not regression\"')",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
]
